<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Impisre DAW Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0A1E">
<meta name="description" content="Impisre DAW Studio — pattern sequencer, synth, WAV/MIDI export">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impisre">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html, body { width:100%; height:100%; background:#0F0A1E;
    font-family:'Courier New',monospace; color:#fff; overflow:hidden;
    position:fixed; top:0; left:0; }
#app { display:flex; flex-direction:column; width:100vw; height:100vh; }

/* TOP BAR */
#topbar { display:flex; align-items:center; gap:5px; padding:6px 8px;
    background:#1A1030; border-bottom:2px solid #00FFC8; flex-wrap:wrap; }
#topbar button, #topbar .lbl {
    padding:5px 10px; font:bold 11px 'Courier New';
    background:#322050; color:#fff; border:1px solid #00FFC8;
    border-radius:4px; cursor:pointer; }
#topbar button:active { background:#00FFC8; color:#000; }
#topbar button.active { background:#00FFC8; color:#000; }
#topbar button.rec { background:#800000; border-color:#FF0000; }
#topbar button.rec.on { background:#FF0000; color:#000; }
#topbar .lbl { cursor:default; background:transparent; border-color:#FF1493; color:#FF1493; }
#topbar .info { margin-left:auto; font-size:11px; color:#00FFFF; }
#btnInstall {
    background:#008B8B !important; border-color:#00FFFF !important;
    color:#FFF !important; display:none; }
#btnInstall:active { background:#00FFFF !important; color:#000 !important; }

/* MAIN AREA */
#canvas-wrap { flex:1; position:relative; overflow:hidden; min-height:0; }
canvas { display:block; width:100%; height:100%; }

/* BOTTOM BAR */
#bottombar { display:flex; align-items:center; gap:5px; padding:6px 8px;
    background:#1A1030; border-top:2px solid #00FFC8; flex-wrap:wrap; }
#bottombar button {
    padding:5px 10px; font:bold 11px 'Courier New';
    background:#322050; color:#fff; border:1px solid #00FFC8;
    border-radius:4px; cursor:pointer; }
#bottombar button:active { background:#00FFC8; color:#000; }
#bottombar button.active { background:#00FFC8; color:#000; }
#bottombar .lbl { color:#00FFFF; font-size:11px; }

#pattern-grid { display:flex; gap:3px; flex-wrap:wrap; }
#pattern-grid button {
    width:28px; height:24px; padding:0; font:bold 10px 'Courier New';
    background:#322050; color:#fff; border:1px solid #00FFC8;
    border-radius:3px; cursor:pointer; }
#pattern-grid button.active { background:#00FF64; color:#000; }

#osc-wrap { height:60px; background:#0A0518; border-top:1px solid #322050; position:relative; flex-shrink:0; }
#osc { display:block; width:100%; height:100%; }

#help { position:absolute; bottom:6px; left:10px; font-size:10px; color:#666; pointer-events:none; }
#status { position:absolute; top:6px; right:10px; font:bold 12px 'Courier New';
    color:#FFFF00; pointer-events:none; }
#sample-name { font:11px; color:#FFD700; }

@media (max-width: 500px) {
    #topbar button, #topbar .lbl, #bottombar button { font-size:10px; padding:4px 7px; }
    #pattern-grid button { width:24px; height:22px; }
    #osc-wrap { height:48px; }
}
</style>
</head>
<body>
<div id="app">

    <div id="topbar">
        <button id="btnPlay">▶ PLAY</button>
        <button id="btnStop">■ STOP</button>
        <button id="btnRec">● REC</button>
        <button id="btnView">VIEW: PIANO</button>
        <button id="btnMode">MODE: PAT</button>
        <span class="lbl">PAT:</span>
        <div id="pattern-grid"></div>
        <button id="btnSave">SAVE</button>
        <button id="btnLoad">LOAD</button>
        <button id="btnWav">WAV</button>
        <button id="btnMid">MIDI</button>
        <button id="btnInstall">⤓ INSTALL</button>
        <span class="info" id="info">Ready</span>
    </div>

    <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="status"></div>
        <div id="help">Click grid to add notes. Keys Z-M Q-I play. F4/5/6 drums. Space=Play. Del=clear pattern</div>
    </div>

    <div id="bottombar">
        <span class="lbl">PRESET:</span>
        <button id="p0" class="active">Saw+Sq</button>
        <button id="p1">FM</button>
        <button id="p2">Tri+Sin</button>
        <span class="lbl">OCT:</span>
        <button id="octDn">−</button>
        <span id="octLbl" style="color:#00FFFF;font-weight:bold;">0</span>
        <button id="octUp">+</button>
        <span class="lbl">WAV:</span>
        <button id="wav1">WAV1</button>
        <button id="wav2">WAV2</button>
        <button id="wav3">WAV3</button>
        <span id="sample-name">(none)</span>
        <span class="lbl">VOL:</span>
        <input type="range" id="masterVol" min="0" max="100" value="40" style="width:80px;">
    </div>

    <div id="osc-wrap">
        <canvas id="osc"></canvas>
    </div>

</div>

<script>
(function(){
'use strict';

// ============================================================
// КОНСТАНТЫ
// ============================================================
const NUM_PATTERNS = 8;
const NUM_STEPS = 16;
const PLAYLIST_TRACKS = 8;
const PLAYLIST_BARS = 32;
const BPM = 120;
const STEPS_PER_BEAT = 4;
const SECONDS_PER_STEP = 60.0 / BPM / STEPS_PER_BEAT;
const PATTERN_LEN_SEC = SECONDS_PER_STEP * NUM_STEPS;
const NUM_VOICES = 8;
const TOTAL_ROWS = 31;
const NOTE_MIN = 48;
const NOTE_MAX = 72;
const CACHE_VERSION = 'impisre-v1'; // должен совпадать с sw.js

// ============================================================
// ДАННЫЕ
// ============================================================
let patterns = [];
function newPattern() { return { notes: [] }; }
for (let p = 0; p < NUM_PATTERNS; p++) patterns.push(newPattern());

let currentPatternIdx = 0;

let playlist = [];
for (let t = 0; t < PLAYLIST_TRACKS; t++) {
    playlist.push(new Array(PLAYLIST_BARS).fill(-1));
}

let currentView = 'piano';
let playMode = 'pattern';

let isPlaying = false;
let isRecording = false;

let presetType = 0;
let octaveShift = 0;

const samples = [
    { name: '(none)', buffer: null, loaded: false },
    { name: '(none)', buffer: null, loaded: false },
    { name: '(none)', buffer: null, loaded: false }
];

// ============================================================
// WEB AUDIO
// ============================================================
let actx = null;
let masterGain = null;
let masterFilter = null;
let analyser = null;

function initAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();

    masterFilter = actx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 20000;

    masterGain = actx.createGain();
    masterGain.gain.value = 0.4;

    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;

    masterGain.connect(masterFilter);
    masterFilter.connect(analyser);
    analyser.connect(actx.destination);
}

// ============================================================
// WAVE PRESETS
// ============================================================
let waveArrays = null;
function buildWavePresets() {
    const sawSq = new Float32Array(32);
    for (let n = 1; n < 32; n++) {
        let saw = 1 / n;
        let sq = (n % 2 === 1) ? (4 / (n * Math.PI)) : 0;
        sawSq[n] = saw * 0.5 + sq * 0.3;
    }
    const fm = new Float32Array(32);
    for (let n = 1; n < 32; n++) {
        fm[n] = (n % 2 === 1) ? (1 / n) : 0;
    }
    const tri = new Float32Array(32);
    for (let n = 1; n < 32; n++) {
        let t = (n % 2 === 1) ? (1 / (n * n)) * (n % 4 === 1 ? 1 : -1) : 0;
        let s = (n === 1) ? 1 : 0;
        tri[n] = t * 0.5 + s * 0.4;
    }
    return [sawSq, fm, tri];
}

function getPeriodicWave(ctx, presetIdx) {
    if (!waveArrays) waveArrays = buildWavePresets();
    const arr = waveArrays[presetIdx];
    const real = new Float32Array(arr.length);
    const imag = new Float32Array(arr);
    return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

// ============================================================
// БАРАБАНЫ
// ============================================================
let drumBuffers = null;
function makeDrums(ctx) {
    const sr = ctx.sampleRate;

    const kickLen = Math.floor(sr * 0.5);
    const kickBuf = ctx.createBuffer(1, kickLen, sr);
    const kd = kickBuf.getChannelData(0);
    let kPhase = 0, kEnv = 1, kFreq = 160;
    for (let i = 0; i < kickLen; i++) {
        kd[i] = Math.sin(kPhase) * kEnv * 1.5;
        kPhase += 2 * Math.PI * kFreq / sr;
        kFreq *= 0.9990;
        kEnv *= 0.9994;
    }

    const snLen = Math.floor(sr * 0.3);
    const snBuf = ctx.createBuffer(1, snLen, sr);
    const sd = snBuf.getChannelData(0);
    let sEnv = 1;
    for (let i = 0; i < snLen; i++) {
        sd[i] = (Math.random() * 2 - 1) * sEnv * 0.8;
        sEnv *= 0.9988;
    }

    const hhLen = Math.floor(sr * 0.15);
    const hhBuf = ctx.createBuffer(1, hhLen, sr);
    const hd = hhBuf.getChannelData(0);
    let hEnv = 1;
    for (let i = 0; i < hhLen; i++) {
        hd[i] = (Math.random() * 2 - 1) * hEnv * 0.5;
        hEnv *= 0.994;
    }

    return [kickBuf, snBuf, hhBuf];
}

function playDrum(subType, ctx, destination, when) {
    if (!drumBuffers) drumBuffers = makeDrums(ctx);
    const src = ctx.createBufferSource();
    src.buffer = drumBuffers[subType];
    src.connect(destination);
    src.start(when || 0);
}

function playSample(sampleIdx, ctx, destination, when) {
    const s = samples[sampleIdx];
    if (!s.loaded || !s.buffer) return;
    const src = ctx.createBufferSource();
    src.buffer = s.buffer;
    src.connect(destination);
    src.start(when || 0);
}

// ============================================================
// ГОЛОСА
// ============================================================
const voices = [];
for (let i = 0; i < NUM_VOICES; i++) {
    voices.push({ osc:null, gain:null, active:false, note:-1, keyReleased:true });
}

function noteToFreq(note) {
    return 440.0 * Math.pow(2, (note - 69) / 12);
}

function noteOn(note, ctx, destination, when) {
    if (!ctx) ctx = actx;
    if (!destination) destination = masterGain;
    const t = when !== undefined ? when : ctx.currentTime;

    let v = voices.find(x => x.active && x.note === note);
    if (!v) v = voices.find(x => !x.active);
    if (!v) v = voices[0];

    if (v.osc) { try { v.osc.stop(); } catch(e){} }

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.setPeriodicWave(getPeriodicWave(ctx, presetType));
    osc.frequency.value = noteToFreq(note + octaveShift * 12);

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.8, t + 0.01);

    osc.connect(gain);
    gain.connect(destination);
    osc.start(t);

    v.osc = osc;
    v.gain = gain;
    v.active = true;
    v.note = note;
    v.keyReleased = false;

    return v;
}

function noteOff(note, ctx, when) {
    if (!ctx) ctx = actx;
    const t = when !== undefined ? when : ctx.currentTime;
    for (const v of voices) {
        if (v.active && v.note === note && !v.keyReleased) {
            v.keyReleased = true;
            try {
                v.gain.gain.cancelScheduledValues(t);
                v.gain.gain.setValueAtTime(v.gain.gain.value, t);
                v.gain.gain.linearRampToValueAtTime(0, t + 0.15);
                v.osc.stop(t + 0.16);
            } catch(e){}
            v.active = false;
        }
    }
}

function panic() {
    for (const v of voices) {
        if (v.osc) { try { v.osc.stop(); } catch(e){} }
        v.active = false;
        v.osc = null;
    }
}

// ============================================================
// ВОСПРОИЗВЕДЕНИЕ
// ============================================================
let schedulerTimer = null;
let nextStepTime = 0;
let schedulerStep = 0;
let schedulerBar = 0;
let playStartTime = 0;
const LOOKAHEAD = 0.15;
const SCHED_INTERVAL = 40;

function getScheduledPatternsForStep(step, bar) {
    if (playMode === 'pattern') {
        return [{ patternIdx: currentPatternIdx }];
    } else {
        const arr = [];
        for (let t = 0; t < PLAYLIST_TRACKS; t++) {
            const pIdx = playlist[t][bar];
            if (pIdx >= 0 && pIdx < NUM_PATTERNS) arr.push({ patternIdx: pIdx });
        }
        return arr;
    }
}

function scheduler() {
    if (!isPlaying || !actx) return;
    while (nextStepTime < actx.currentTime + LOOKAHEAD) {
        scheduleStep(schedulerStep, schedulerBar, nextStepTime);
        nextStepTime += SECONDS_PER_STEP;
        schedulerStep = (schedulerStep + 1) % NUM_STEPS;
        if (schedulerStep === 0) {
            if (playMode === 'song') {
                schedulerBar = (schedulerBar + 1) % PLAYLIST_BARS;
            }
        }
    }
}

function scheduleStep(step, bar, time) {
    const patList = getScheduledPatternsForStep(step, bar);
    for (const { patternIdx } of patList) {
        const pat = patterns[patternIdx];
        for (const n of pat.notes) {
            if (n.step !== step) continue;
            if (n.type === 0) {
                noteOn(n.note, actx, masterGain, time);
                const relT = time + n.dur * SECONDS_PER_STEP;
                noteOff(n.note, actx, relT);
            } else if (n.type === 1) {
                playDrum(n.subType, actx, masterGain, time);
            } else if (n.type === 2) {
                playSample(n.subType, actx, masterGain, time);
            }
        }
    }
}

function startPlayback() {
    initAudio();
    if (actx.state === 'suspended') actx.resume();
    isPlaying = true;
    schedulerStep = 0;
    schedulerBar = 0;
    nextStepTime = actx.currentTime + 0.05;
    playStartTime = actx.currentTime;
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(scheduler, SCHED_INTERVAL);
    updateStatus();
}

function stopPlayback() {
    isPlaying = false;
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = null;
    panic();
    updateStatus();
    draw();
}

// ============================================================
// РИСОВАНИЕ
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    draw();
}

let gridRect = { x: 0, y: 0, w: 0, h: 0, rowH: 0, colW: 0 };

function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#0F0A1E';
    ctx.fillRect(0, 0, w, h);

    if (currentView === 'piano') drawPianoRoll(w, h);
    else drawPlaylist(w, h);
}

function drawPianoRoll(w, h) {
    const padL = 60, padT = 10, padR = 10, padB = 30;
    gridRect.x = padL; gridRect.y = padT;
    gridRect.w = w - padL - padR;
    gridRect.h = h - padT - padB;
    gridRect.rowH = gridRect.h / TOTAL_ROWS;
    gridRect.colW = gridRect.w / NUM_STEPS;

    ctx.fillStyle = '#140A28';
    ctx.fillRect(gridRect.x, gridRect.y, gridRect.w, gridRect.h);

    ctx.font = '10px "Courier New"';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('WAV1', gridRect.x - 5, gridRect.y + gridRect.rowH * 0.5);
    ctx.fillText('WAV2', gridRect.x - 5, gridRect.y + gridRect.rowH * 1.5);
    ctx.fillText('WAV3', gridRect.x - 5, gridRect.y + gridRect.rowH * 2.5);
    ctx.fillStyle = '#FF3278';
    ctx.fillText('KICK', gridRect.x - 5, gridRect.y + gridRect.rowH * 3.5);
    ctx.fillText('SNR ', gridRect.x - 5, gridRect.y + gridRect.rowH * 4.5);
    ctx.fillText('HH  ', gridRect.x - 5, gridRect.y + gridRect.rowH * 5.5);
    ctx.fillStyle = '#00FFC8';
    const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for (let i = 0; i < 25; i++) {
        const note = NOTE_MAX - i;
        const name = noteNames[note % 12] + Math.floor(note / 12 - 1);
        ctx.fillText(name, gridRect.x - 5, gridRect.y + gridRect.rowH * (6 + i + 0.5));
    }
    ctx.textAlign = 'left';

    for (let i = 0; i <= NUM_STEPS; i++) {
        ctx.beginPath();
        ctx.moveTo(gridRect.x + i * gridRect.colW, gridRect.y);
        ctx.lineTo(gridRect.x + i * gridRect.colW, gridRect.y + gridRect.h);
        ctx.strokeStyle = (i % 4 === 0) ? '#504080' : '#2A1848';
        ctx.stroke();
    }
    for (let r = 0; r <= TOTAL_ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(gridRect.x, gridRect.y + r * gridRect.rowH);
        ctx.lineTo(gridRect.x + gridRect.w, gridRect.y + r * gridRect.rowH);
        if (r === 3 || r === 6) { ctx.strokeStyle = '#504080'; ctx.lineWidth = 2; }
        else { ctx.strokeStyle = '#2A1848'; ctx.lineWidth = 1; }
        ctx.stroke();
    }
    ctx.lineWidth = 1;

    const pat = patterns[currentPatternIdx];
    for (const n of pat.notes) {
        let row = -1, color = '#00FFC8';
        if (n.type === 2) { row = n.subType; color = '#FFD700'; }
        else if (n.type === 1) { row = 3 + n.subType; color = '#FF3278'; }
        else {
            const idx = NOTE_MAX - n.note;
            if (idx < 0 || idx > 24) continue;
            row = 6 + idx;
        }
        const x = gridRect.x + n.step * gridRect.colW;
        const y = gridRect.y + row * gridRect.rowH;
        const durW = Math.max(gridRect.colW * n.dur, gridRect.colW - 1);
        ctx.fillStyle = color;
        ctx.fillRect(x + 1, y + 1, durW - 2, gridRect.rowH - 2);
    }

    if (isPlaying) {
        let step;
        if (playMode === 'pattern') {
            const t = (actx.currentTime - playStartTime) % PATTERN_LEN_SEC;
            step = Math.floor(t / SECONDS_PER_STEP) % NUM_STEPS;
        } else {
            const totalSongSec = PATTERN_LEN_SEC * PLAYLIST_BARS;
            const t = (actx.currentTime - playStartTime) % totalSongSec;
            step = Math.floor((t % PATTERN_LEN_SEC) / SECONDS_PER_STEP) % NUM_STEPS;
        }
        const x = gridRect.x + step * gridRect.colW;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, gridRect.y, 2, gridRect.h);
    }
}

function drawPlaylist(w, h) {
    const padL = 70, padT = 10, padR = 10, padB = 30;
    gridRect.x = padL; gridRect.y = padT;
    gridRect.w = w - padL - padR;
    gridRect.h = h - padT - padB;
    gridRect.rowH = gridRect.h / PLAYLIST_TRACKS;
    gridRect.colW = gridRect.w / PLAYLIST_BARS;

    ctx.fillStyle = '#0F1420';
    ctx.fillRect(gridRect.x, gridRect.y, gridRect.w, gridRect.h);

    ctx.font = '10px "Courier New"';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00FFC8';
    for (let t = 0; t < PLAYLIST_TRACKS; t++) {
        ctx.fillText('TRK ' + (t + 1), gridRect.x - 5, gridRect.y + gridRect.rowH * (t + 0.5));
    }
    ctx.textAlign = 'left';

    for (let i = 0; i <= PLAYLIST_BARS; i++) {
        ctx.beginPath();
        ctx.moveTo(gridRect.x + i * gridRect.colW, gridRect.y);
        ctx.lineTo(gridRect.x + i * gridRect.colW, gridRect.y + gridRect.h);
        ctx.strokeStyle = (i % 4 === 0) ? '#4060A0' : '#2A3A5A';
        ctx.stroke();
    }
    for (let t = 0; t <= PLAYLIST_TRACKS; t++) {
        ctx.beginPath();
        ctx.moveTo(gridRect.x, gridRect.y + t * gridRect.rowH);
        ctx.lineTo(gridRect.x + gridRect.w, gridRect.y + t * gridRect.rowH);
        ctx.strokeStyle = '#2A3A5A';
        ctx.stroke();
    }

    ctx.fillStyle = '#FFFF00';
    ctx.font = '9px "Courier New"';
    for (let b = 0; b < PLAYLIST_BARS; b++) {
        if (b % 4 === 0) {
            ctx.fillText(b.toString(), gridRect.x + b * gridRect.colW + 2, gridRect.y - 2);
        }
    }

    const patColors = [
        '#FF6464', '#64FF64', '#6464FF', '#FFFF64',
        '#FF64FF', '#64FFFF', '#FF9632', '#C864FF'
    ];
    for (let t = 0; t < PLAYLIST_TRACKS; t++) {
        for (let b = 0; b < PLAYLIST_BARS; b++) {
            const pIdx = playlist[t][b];
            if (pIdx >= 0 && pIdx < NUM_PATTERNS) {
                const x = gridRect.x + b * gridRect.colW;
                const y = gridRect.y + t * gridRect.rowH;
                ctx.fillStyle = patColors[pIdx];
                ctx.fillRect(x + 1, y + 1, gridRect.colW - 2, gridRect.rowH - 2);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 9px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P' + (pIdx + 1), x + gridRect.colW / 2, y + gridRect.rowH / 2);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }
    }

    if (isPlaying && playMode === 'song') {
        const totalSongSec = PATTERN_LEN_SEC * PLAYLIST_BARS;
        const t = (actx.currentTime - playStartTime) % totalSongSec;
        const playX = gridRect.x + (t / totalSongSec) * gridRect.w;
        ctx.fillStyle = '#FFFF00';
        ctx.fillRect(playX, gridRect.y, 2, gridRect.h);
    }
}

// ============================================================
// МЫШЬ
// ============================================================
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (x < gridRect.x || x > gridRect.x + gridRect.w) return;
    if (y < gridRect.y || y > gridRect.y + gridRect.h) return;

    if (currentView === 'piano') {
        handlePianoClick(x, y);
    } else {
        handlePlaylistClick(x, y);
    }
});

function handlePianoClick(x, y) {
    const step = Math.floor((x - gridRect.x) / gridRect.colW);
    const row = Math.floor((y - gridRect.y) / gridRect.rowH);
    if (step < 0 || step >= NUM_STEPS || row < 0 || row >= TOTAL_ROWS) return;

    const pat = patterns[currentPatternIdx];

    let existingIdx = -1;
    for (let i = 0; i < pat.notes.length; i++) {
        const n = pat.notes[i];
        let r = -1;
        if (n.type === 2) r = n.subType;
        else if (n.type === 1) r = 3 + n.subType;
        else r = 6 + (NOTE_MAX - n.note);
        if (r === row && n.step === step) { existingIdx = i; break; }
    }

    if (existingIdx !== -1) {
        pat.notes.splice(existingIdx, 1);
    } else {
        if (row < 3) {
            pat.notes.push({ step, note: 0, dur: 1, type: 2, subType: row });
            initAudio();
            if (actx.state === 'suspended') actx.resume();
            playSample(row, actx, masterGain);
        } else if (row < 6) {
            pat.notes.push({ step, note: 0, dur: 1, type: 1, subType: row - 3 });
            initAudio();
            if (actx.state === 'suspended') actx.resume();
            playDrum(row - 3, actx, masterGain);
        } else {
            const note = NOTE_MAX - (row - 6);
            if (note < NOTE_MIN) return;
            pat.notes.push({ step, note, dur: 1, type: 0, subType: 0 });
            initAudio();
            if (actx.state === 'suspended') actx.resume();
            noteOn(note, actx, masterGain);
            setTimeout(() => noteOff(note), 300);
        }
    }
    draw();
    updateStatus();
}

function handlePlaylistClick(x, y) {
    const track = Math.floor((y - gridRect.y) / gridRect.rowH);
    const bar = Math.floor((x - gridRect.x) / gridRect.colW);
    if (track < 0 || track >= PLAYLIST_TRACKS) return;
    if (bar < 0 || bar >= PLAYLIST_BARS) return;

    if (playlist[track][bar] === currentPatternIdx) {
        playlist[track][bar] = -1;
    } else {
        playlist[track][bar] = currentPatternIdx;
    }
    draw();
}

const keyMap = {
    'z': 48, 's': 49, 'x': 50, 'd': 51, 'c': 52, 'v': 53, 'g': 54, 'b': 55,
    'h': 56, 'n': 57, 'j': 58, 'm': 59,
    'q': 60, '2': 61, 'w': 62, '3': 63, 'e': 64, 'r': 65, '5': 66, 't': 67,
    '6': 68, 'y': 69, '7': 70, 'u': 71, 'i': 72
};
const pressedKeys = {};

document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();

    if (k === ' ') {
        e.preventDefault();
        if (isPlaying) stopPlayback(); else startPlayback();
        return;
    }
    if (k === 'delete') {
        e.preventDefault();
        patterns[currentPatternIdx].notes = [];
        draw();
        updateStatus();
        return;
    }
    if (e.key === 'F4') { e.preventDefault(); initAudio(); if (actx.state==='suspended') actx.resume(); playDrum(0, actx, masterGain); return; }
    if (e.key === 'F5') { e.preventDefault(); initAudio(); if (actx.state==='suspended') actx.resume(); playDrum(1, actx, masterGain); return; }
    if (e.key === 'F6') { e.preventDefault(); initAudio(); if (actx.state==='suspended') actx.resume(); playDrum(2, actx, masterGain); return; }

    if (k >= '1' && k <= '8') {
        currentPatternIdx = parseInt(k) - 1;
        updatePatternButtons();
        draw();
        return;
    }

    if (k === 'tab') {
        e.preventDefault();
        currentView = (currentView === 'piano') ? 'playlist' : 'piano';
        updateViewButton();
        draw();
        return;
    }

    if (keyMap[k] !== undefined && !pressedKeys[k]) {
        pressedKeys[k] = true;
        initAudio();
        if (actx.state === 'suspended') actx.resume();
        noteOn(keyMap[k], actx, masterGain);
        if (isRecording) {
            const pat = patterns[currentPatternIdx];
            const step = schedulerStep;
            pat.notes.push({ step, note: keyMap[k], dur: 1, type: 0, subType: 0 });
            draw();
            updateStatus();
        }
    }
});

document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (keyMap[k] !== undefined && pressedKeys[k]) {
        pressedKeys[k] = false;
        noteOff(keyMap[k]);
    }
});

document.getElementById('btnWav').onclick = async () => {
    initAudio();
    if (actx.state === 'suspended') actx.resume();

    const isSong = playMode === 'song';
    const totalSeconds = isSong ? PATTERN_LEN_SEC * PLAYLIST_BARS : PATTERN_LEN_SEC;

    const sampleRate = 44100;
    const offCtx = new OfflineAudioContext(1, Math.floor(sampleRate * totalSeconds), sampleRate);
    const offGain = offCtx.createGain();
    offGain.gain.value = 0.4;
    offGain.connect(offCtx.destination);

    const processPatternAt = (pIdx, tOffset) => {
        const pat = patterns[pIdx];
        for (const n of pat.notes) {
            const t = tOffset + n.step * SECONDS_PER_STEP;
            if (n.type === 0) {
                const osc = offCtx.createOscillator();
                const g = offCtx.createGain();
                osc.setPeriodicWave(getPeriodicWave(offCtx, presetType));
                osc.frequency.value = noteToFreq(n.note + octaveShift * 12);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.8, t + 0.01);
                g.gain.setValueAtTime(0.8, t + n.dur * SECONDS_PER_STEP);
                g.gain.linearRampToValueAtTime(0, t + n.dur * SECONDS_PER_STEP + 0.15);
                osc.connect(g);
                g.connect(offGain);
                osc.start(t);
                osc.stop(t + n.dur * SECONDS_PER_STEP + 0.2);
            } else if (n.type === 1) {
                const drums = makeDrums(offCtx);
                const src = offCtx.createBufferSource();
                src.buffer = drums[n.subType];
                src.connect(offGain);
                src.start(t);
            } else if (n.type === 2) {
                const s = samples[n.subType];
                if (s.loaded && s.buffer) {
                    const src = offCtx.createBufferSource();
                    const newBuf = offCtx.createBuffer(s.buffer.numberOfChannels, s.buffer.length, s.buffer.sampleRate);
                    for (let ch = 0; ch < s.buffer.numberOfChannels; ch++) {
                        newBuf.getChannelData(ch).set(s.buffer.getChannelData(ch));
                    }
                    src.buffer = newBuf;
                    src.connect(offGain);
                    src.start(t);
                }
            }
        }
    };

    if (isSong) {
        for (let bar = 0; bar < PLAYLIST_BARS; bar++) {
            const tOffset = bar * PATTERN_LEN_SEC;
            for (let tr = 0; tr < PLAYLIST_TRACKS; tr++) {
                const pIdx = playlist[tr][bar];
                if (pIdx >= 0 && pIdx < NUM_PATTERNS) {
                    processPatternAt(pIdx, tOffset);
                }
            }
        }
    } else {
        processPatternAt(currentPatternIdx, 0);
    }

    const rendered = await offCtx.startRendering();
    const wavBlob = audioBufferToWav(rendered);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(wavBlob);
    a.download = isSong ? 'impisre_song.wav' : 'impisre_pattern.wav';
    a.click();
};

function audioBufferToWav(buffer) {
    const numCh = buffer.numberOfChannels;
    const sr = buffer.sampleRate;
    const len = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numCh * bytesPerSample;
    const dataSize = len * blockAlign;
    const ab = new ArrayBuffer(44 + dataSize);
    const view = new DataView(ab);

    writeStr(view, 0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(view, 8, 'WAVE');
    writeStr(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeStr(view, 36, 'data');
    view.setUint32(40, dataSize, true);

    const channels = [];
    for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));

    let offset = 44;
    for (let i = 0; i < len; i++) {
        for (let c = 0; c < numCh; c++) {
            let s = Math.max(-1, Math.min(1, channels[c][i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
        }
    }
    return new Blob([ab], { type: 'audio/wav' });
}

function writeStr(view, offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
}

document.getElementById('btnMid').onclick = () => {
    const isSong = playMode === 'song';
    const totalBars = isSong ? PLAYLIST_BARS : 1;
    const ticksPerBar = 96 * 4;

    const events = [];

    const addPatternEvents = (pIdx, barOffset) => {
        const pat = patterns[pIdx];
        for (const n of pat.notes) {
            const startTick = barOffset * ticksPerBar + Math.floor((n.step * ticksPerBar) / NUM_STEPS);
            const durTick = Math.floor((n.dur * ticksPerBar) / NUM_STEPS);
            if (n.type === 0) {
                events.push({ tick: startTick, on: true, note: n.note, ch: 0 });
                events.push({ tick: startTick + durTick, on: false, note: n.note, ch: 0 });
            } else if (n.type === 1) {
                let drumNote = 36;
                if (n.subType === 1) drumNote = 38;
                if (n.subType === 2) drumNote = 42;
                events.push({ tick: startTick, on: true, note: drumNote, ch: 9 });
                events.push({ tick: startTick + durTick, on: false, note: drumNote, ch: 9 });
            }
        }
    };

    if (isSong) {
        for (let bar = 0; bar < PLAYLIST_BARS; bar++) {
            for (let tr = 0; tr < PLAYLIST_TRACKS; tr++) {
                const pIdx = playlist[tr][bar];
                if (pIdx >= 0 && pIdx < NUM_PATTERNS) {
                    addPatternEvents(pIdx, bar);
                }
            }
        }
    } else {
        addPatternEvents(currentPatternIdx, 0);
    }

    events.sort((a, b) => a.tick - b.tick);

    const bytes = [];
    bytes.push(0x4D, 0x54, 0x68, 0x64);
    bytes.push(0, 0, 0, 6);
    bytes.push(0, 0);
    bytes.push(0, 1);
    bytes.push(0, 96);
    bytes.push(0x4D, 0x54, 0x72, 0x6B);
    const trackStart = bytes.length;
    bytes.push(0, 0, 0, 0);

    let lastTick = 0;
    for (const ev of events) {
        const delta = ev.tick - lastTick;
        writeVarLen(bytes, delta);
        bytes.push((ev.on ? 0x90 : 0x80) | (ev.ch & 0x0F), ev.note, ev.on ? 100 : 0);
        lastTick = ev.tick;
    }
    writeVarLen(bytes, 0);
    bytes.push(0xFF, 0x2F, 0x00);

    const trackLen = bytes.length - trackStart - 4;
    bytes[trackStart] = (trackLen >> 24) & 0xFF;
    bytes[trackStart + 1] = (trackLen >> 16) & 0xFF;
    bytes[trackStart + 2] = (trackLen >> 8) & 0xFF;
    bytes[trackStart + 3] = trackLen & 0xFF;

    const blob = new Blob([new Uint8Array(bytes)], { type: 'audio/midi' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = isSong ? 'impisre_song.mid' : 'impisre_pattern.mid';
    a.click();
};

function writeVarLen(arr, value) {
    let buffer = value & 0x7F;
    while ((value >>= 7)) {
        buffer <<= 8;
        buffer |= ((value & 0x7F) | 0x80);
    }
    while (true) {
        arr.push(buffer & 0xFF);
        if (buffer & 0x80) buffer >>= 8;
        else break;
    }
}

// ОСЦИЛЛОГРАФ
// ============================================================
const oscCanvas = document.getElementById('osc');
const oscCtx = oscCanvas.getContext('2d');
let oscData = null;

function resizeOsc() {
    oscCanvas.width = oscCanvas.clientWidth;
    oscCanvas.height = oscCanvas.clientHeight;
}

function drawOsc() {
    const w = oscCanvas.width, h = oscCanvas.height;
    oscCtx.fillStyle = '#0A0518';
    oscCtx.fillRect(0, 0, w, h);

    oscCtx.strokeStyle = '#322050';
    oscCtx.beginPath();
    oscCtx.moveTo(0, h/2);
    oscCtx.lineTo(w, h/2);
    oscCtx.stroke();

    if (!analyser) return;

    if (!oscData || oscData.length !== analyser.fftSize) {
        oscData = new Uint8Array(analyser.fftSize);
    }
    analyser.getByteTimeDomainData(oscData);

    oscCtx.strokeStyle = '#00FFC8';
    oscCtx.lineWidth = 1.5;
    oscCtx.beginPath();
    for (let i = 0; i < oscData.length; i++) {
        const x = (i / oscData.length) * w;
        const y = h / 2 + ((oscData[i] - 128) / 128) * (h / 2 - 4);
        if (i === 0) oscCtx.moveTo(x, y);
        else oscCtx.lineTo(x, y);
    }
    oscCtx.stroke();

    oscCtx.fillStyle = '#FF1493';
    oscCtx.font = 'bold 10px "Courier New"';
    oscCtx.fillText('OSCILLOSCOPE', 6, 12);
}
